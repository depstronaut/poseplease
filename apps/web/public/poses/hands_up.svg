<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Head -->
  <circle cx="200" cy="115" r="28" fill="#14110F" />
  
  <!-- Torso & Neck -->
  <line x1="200" y1="143" x2="200" y2="175" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="200" y1="175" x2="200" y2="300" stroke="#14110F" stroke-width="16" stroke-linecap="round" />
  
  <!-- Shoulders -->
  <line x1="130" y1="175" x2="270" y2="175" stroke="#14110F" stroke-width="14" stroke-linecap="round" />

  <!-- Left Arm (Screen Right): raised up in Y -->
  <line x1="270" y1="175" x2="320" y2="105" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="320" y1="105" x2="360" y2="35" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Right Arm (Screen Left): raised up in Y -->
  <line x1="130" y1="175" x2="80" y2="105" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="80" y1="105" x2="40" y2="35" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Flat Joint Dots (No Glow) -->
  <circle cx="130" cy="175" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="270" cy="175" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="80" cy="105" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="320" cy="105" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="40" cy="35" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
  <circle cx="360" cy="35" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
</svg>
