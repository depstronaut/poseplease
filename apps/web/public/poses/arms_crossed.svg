<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Head -->
  <circle cx="200" cy="85" r="28" fill="#14110F" />
  
  <!-- Torso & Neck -->
  <line x1="200" y1="113" x2="200" y2="145" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="200" y1="145" x2="200" y2="280" stroke="#14110F" stroke-width="16" stroke-linecap="round" />
  
  <!-- Shoulders -->
  <line x1="125" y1="145" x2="275" y2="145" stroke="#14110F" stroke-width="14" stroke-linecap="round" />

  <!-- Left Arm (Screen Right): crossed over chest -->
  <line x1="275" y1="145" x2="310" y2="225" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="310" y1="225" x2="160" y2="195" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Right Arm (Screen Left): crossed over chest -->
  <line x1="125" y1="145" x2="90" y2="225" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="90" y1="225" x2="240" y2="195" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Flat Joint Dots (No Glow) -->
  <circle cx="125" cy="145" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="275" cy="145" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="90" cy="225" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="310" cy="225" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="160" cy="195" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
  <circle cx="240" cy="195" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
</svg>
