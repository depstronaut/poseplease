<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Head -->
  <circle cx="200" cy="100" r="28" fill="#14110F" />
  
  <!-- Torso & Neck -->
  <line x1="200" y1="128" x2="200" y2="160" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="200" y1="160" x2="200" y2="290" stroke="#14110F" stroke-width="16" stroke-linecap="round" />
  
  <!-- Shoulders -->
  <line x1="125" y1="160" x2="275" y2="160" stroke="#14110F" stroke-width="14" stroke-linecap="round" />

  <!-- Left Arm (Screen Right): hands to temples/head -->
  <line x1="275" y1="160" x2="330" y2="105" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="330" y1="105" x2="245" y2="90" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Right Arm (Screen Left): hands to temples/head -->
  <line x1="125" y1="160" x2="70" y2="105" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="70" y1="105" x2="155" y2="90" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Flat Joint Dots (No Glow) -->
  <circle cx="125" cy="160" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="275" cy="160" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="70" cy="105" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="330" cy="105" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="155" cy="90" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
  <circle cx="245" cy="90" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
</svg>
