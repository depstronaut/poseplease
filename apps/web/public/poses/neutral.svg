<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Head -->
  <circle cx="200" cy="85" r="28" fill="#14110F" />
  
  <!-- Torso & Neck -->
  <line x1="200" y1="113" x2="200" y2="145" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="200" y1="145" x2="200" y2="280" stroke="#14110F" stroke-width="16" stroke-linecap="round" />
  
  <!-- Shoulders -->
  <line x1="120" y1="145" x2="280" y2="145" stroke="#14110F" stroke-width="14" stroke-linecap="round" />

  <!-- Left Arm (Screen Right): hanging down -->
  <line x1="280" y1="145" x2="280" y2="225" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="280" y1="225" x2="280" y2="305" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Right Arm (Screen Left): hanging down -->
  <line x1="120" y1="145" x2="120" y2="225" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="120" y1="225" x2="120" y2="305" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Flat Joint Dots (No Glow) -->
  <circle cx="120" cy="145" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="280" cy="145" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="120" cy="225" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="280" cy="225" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="120" cy="305" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
  <circle cx="280" cy="305" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
</svg>
