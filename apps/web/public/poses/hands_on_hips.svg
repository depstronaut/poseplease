<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Head -->
  <circle cx="200" cy="85" r="28" fill="#14110F" />
  
  <!-- Torso & Neck -->
  <line x1="200" y1="113" x2="200" y2="145" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="200" y1="145" x2="200" y2="280" stroke="#14110F" stroke-width="16" stroke-linecap="round" />
  
  <!-- Shoulders -->
  <line x1="130" y1="145" x2="270" y2="145" stroke="#14110F" stroke-width="14" stroke-linecap="round" />

  <!-- Left Arm (Screen Right): akimbo elbow out -->
  <line x1="270" y1="145" x2="340" y2="210" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="340" y1="210" x2="255" y2="255" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Right Arm (Screen Left): akimbo elbow out -->
  <line x1="130" y1="145" x2="60" y2="210" stroke="#14110F" stroke-width="12" stroke-linecap="round" />
  <line x1="60" y1="210" x2="145" y2="255" stroke="#14110F" stroke-width="12" stroke-linecap="round" />

  <!-- Flat Joint Dots (No Glow) -->
  <circle cx="130" cy="145" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="270" cy="145" r="9" fill="#FF4A1C" stroke="#14110F" stroke-width="2.5" />
  <circle cx="60" cy="210" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="340" cy="210" r="8" fill="#FFD93B" stroke="#14110F" stroke-width="2" />
  <circle cx="145" cy="255" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
  <circle cx="255" cy="255" r="7" fill="#7ED9A6" stroke="#14110F" stroke-width="2" />
</svg>
